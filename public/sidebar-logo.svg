<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="420" height="180" fill="none">
  <!-- Turquoise Background Circle -->
  <circle cx="100" cy="90" r="75" fill="#38DEC4" />
  
  <!-- Red Geometric Shapes -->
  <!-- Top row: middle square, right rounded-top-right corner -->
  <rect x="80" y="47" width="22" height="22" rx="2" fill="#E62727" />
  <path d="M106 47 H 117 A 11 11 0 0 1 128 58 V 69 H 106 Z" fill="#E62727" />
  
  <!-- Middle row: left square, center square, right square -->
  <rect x="54" y="73" width="22" height="22" rx="2" fill="#E62727" />
  <rect x="80" y="73" width="22" height="22" rx="2" fill="#E62727" />
  <rect x="106" y="73" width="22" height="22" rx="2" fill="#E62727" />
  
  <!-- Bottom row: left rounded-bottom-left corner, middle square -->
  <path d="M54 99 H 76 V 121 H 65 A 11 11 0 0 1 54 110 Z" fill="#E62727" />
  <rect x="80" y="99" width="22" height="22" rx="2" fill="#E62727" />

  <!-- QUARDCUBE Text -->
  <text x="135" y="95" fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="44" letter-spacing="1">QUARDCUBE</text>
  
  <!-- LABS Text -->
  <text x="135" y="132" fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="36" letter-spacing="2">LABS</text>
  
  <!-- TM Badge -->
  <circle cx="330" cy="62" r="14" stroke="#B81424" stroke-width="2.5" fill="none" />
  <text x="330" y="67" fill="#B81424" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="11" text-anchor="middle">TM</text>
</svg>
